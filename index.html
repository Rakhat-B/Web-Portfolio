<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web-portfolio</title>
  </head>
  <body>
    <!-- View nav: left → desk, right → board, bottom → room; the CSS shows the current view's (body[data-view]). -->
    <nav class="view-nav">
      <button class="view-nav__bottom" data-goto="overview" aria-label="Back to Overview"><span class="view-nav__arrow" aria-hidden="true">↓<span class="tip">Back to Overview</span></span></button>
      <button class="view-nav__right" data-goto="board" aria-label="About Me"><span class="view-nav__arrow" aria-hidden="true">→<span class="tip tip--left">About Me</span></span></button>
      <button class="view-nav__left" data-goto="table" aria-label="Projects Table"><span class="view-nav__arrow" aria-hidden="true">←<span class="tip">Projects Table</span></span></button>
    </nav>
    <!-- Hotspots: shown in the data-in view; main.js keeps each over its data-anchor (x y z) or its view's look-at point. -->
    <button class="hotspot" data-in="overview" data-goto="table"><span class="tip">Projects Table</span></button>
    <button class="hotspot" data-in="overview" data-goto="board"><span class="tip">About Me</span></button>
    <button class="hotspot hotspot--holder" data-in="table" data-anchor="-2.84 4.89 2.8"><span class="tip">Show Projects</span></button>
    <!-- Name of the hovered folder on the desk; the text comes from src/projects.js. -->
    <div class="screen-label screen-label--folder" aria-hidden="true"><span class="tip"></span></div>
    <!-- Board document viewer; main.js sizes it over the sheet that flew up to the camera. -->
    <div class="doc-viewer" hidden>
      <iframe class="doc-viewer__frame" title="Document"></iframe>
      <div class="doc-viewer__bar">
        <a class="doc-viewer__download">Download</a>
        <button class="doc-viewer__close" aria-label="Close document">×</button>
      </div>
    </div>
    <button class="folder-close" aria-label="Close project">×</button>
    <!-- Opened-folder pages; folderPages.js moves them onto the folder in 3D. -->
    <div hidden>
      <article class="page page--left">
        <h2 class="page__title">Project title</h2>
        <p>Short description of the project goes here.</p>
        <div class="page__placeholder">Audio</div>
      </article>
      <article class="page page--right">
        <div class="page__placeholder page__placeholder--tall">PDF preview</div>
        <a class="page__link" href="#">GitHub →</a>
      </article>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
