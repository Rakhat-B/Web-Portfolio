<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No tab icon; this stops the browser asking for /favicon.ico (a 404). -->
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web-portfolio</title>
    <!-- Loading screen font, fetched up front so the title never shows in a fallback. -->
    <link rel="preload" href="/fonts/VT323.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Until src/style.scss arrives (in dev, Vite sends it with the JS a moment after the page):
         a dark, empty page instead of unstyled buttons and links on white. style.scss lifts it. -->
    <style>
      html { background: #0c0806; }
      body { visibility: hidden; }
    </style>
  </head>
  <body>
    <!-- Loading screen over the scene while it loads; loadingScreen.js fills the bar, then clears it away. -->
    <div class="loader" role="status" aria-live="polite">
      <div class="loader__content">
        <h1 class="loader__title"><span class="loader__eyebrow">Interactable</span> Portfolio</h1>
        <p class="loader__by">by Rakhat Bektas</p>
        <div class="loader__track"><div class="loader__bar"></div></div>
        <p class="loader__percent">0%</p>
      </div>
    </div>
    <!-- View nav: left → desk, right → board, bottom → room; the CSS shows the current view's (body[data-view]). -->
    <nav class="view-nav">
      <button class="view-nav__bottom" data-goto="overview" aria-label="Back to Overview"><span class="view-nav__arrow" aria-hidden="true">↓<span class="tip">Back to Overview</span></span></button>
      <button class="view-nav__right" data-goto="board" aria-label="About Me"><span class="view-nav__arrow" aria-hidden="true">→<span class="tip tip--left">About Me</span></span></button>
      <button class="view-nav__left" data-goto="table" aria-label="Projects Table"><span class="view-nav__arrow" aria-hidden="true">←<span class="tip">Projects Table</span></span></button>
    </nav>
    <!-- Hotspots: shown in the data-in view; main.js keeps each over its data-anchor (x y z) or its view's look-at point. -->
    <button class="hotspot" data-in="overview" data-goto="table"><span class="tip">Projects Table</span></button>
    <button class="hotspot" data-in="overview" data-goto="board"><span class="tip">About Me</span></button>
    <button class="hotspot hotspot--holder" data-in="table" data-anchor="-2.84 4.89 2.8"><span class="tip">Show Projects</span></button>
    <!-- Name of the hovered folder on the desk; the text comes from src/projects.js. -->
    <div class="screen-label screen-label--folder" aria-hidden="true"><span class="tip"></span></div>
    <!-- Portrait screens only (core/layout.js); the CSS shows each in its view and hides the desktop nav above. -->
    <nav class="tiles" aria-label="Sections">
      <button class="tile" type="button" data-goto="table">
        <svg class="tile__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.2l2 2h8.8A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" />
        </svg>
        Projects
      </button>
      <button class="tile" type="button" data-goto="board">
        <svg class="tile__icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="15" rx="1.5" />
          <rect x="6" y="7" width="5" height="6" rx="0.5" />
          <path d="M14 8.5h4M14 11.5h4M14 14.5h2.5" />
        </svg>
        Info Board
      </button>
    </nav>
    <button class="room-back" type="button" data-goto="overview" aria-label="Back to the room">×</button>
    <!-- Folder ring / board items: the one in front, with arrows to step through them (main.js). -->
    <div class="carousel-bar">
      <button class="carousel-bar__step" type="button" data-step="-1" aria-label="Previous">‹</button>
      <p class="carousel-bar__label" aria-live="polite">
        <span class="carousel-bar__name"></span>
        <span class="carousel-bar__hint"></span>
      </p>
      <button class="carousel-bar__step" type="button" data-step="1" aria-label="Next">›</button>
    </div>
    <!-- Opened folder, one page at a time. -->
    <div class="page-switch">
      <button class="page-switch__step" type="button" data-page="left" aria-label="Left page">‹</button>
      <span class="page-switch__dot" data-page="left"></span>
      <span class="page-switch__dot" data-page="right"></span>
      <button class="page-switch__step" type="button" data-page="right" aria-label="Right page">›</button>
    </div>
    <!-- Board document viewer; main.js sizes it over the sheet that flew up to the camera. -->
    <div class="doc-viewer" hidden>
      <iframe class="doc-viewer__frame" title="Document" allow="autoplay; fullscreen"></iframe>
      <!-- Portrait: a board note's text, readable on a phone. -->
      <div class="doc-viewer__text"></div>
      <div class="doc-viewer__bar">
        <a class="doc-viewer__download">Download</a>
        <button class="doc-viewer__close" aria-label="Close document">×</button>
      </div>
    </div>
    <button class="folder-close" aria-label="Close project">×</button>
    <!-- Background music controls (musicPlayer.js): hidden until the track loads. -->
    <div class="music" role="group" aria-label="Background music" hidden>
      <button class="music__toggle" type="button" aria-label="Mute music" aria-pressed="false">
        <svg class="music__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path class="music__speaker" d="M3 9.5h4l5-4v13l-5-4H3z" />
          <path class="music__waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" />
          <path class="music__cross" d="M16 9.5l5 5M21 9.5l-5 5" />
        </svg>
      </button>
      <input class="music__volume" type="range" min="0" max="100" step="1" aria-label="Music volume" />
    </div>
    <!-- Opened-folder pages; folderPages.js moves them onto the folder in 3D. -->
    <div hidden>
      <!-- Filled from src/projects.js when a folder opens (fillPages in folderPages.js). -->
      <article class="page page--left">
        <h2 class="page__title"></h2>
        <p class="page__description"></p>
        <audio class="page__audio" controls preload="none"></audio>
        <div class="page__links">
          <div class="page__docs"></div>
          <a class="page__link page__github" target="_blank" rel="noopener">GitHub →</a>
        </div>
        <div class="page__slides-wrap">
          <iframe class="page__slides" title="Project slides" allow="autoplay; fullscreen"></iframe>
          <button class="page__expand page__expand--slides" type="button">⤢ Full view</button>
        </div>
      </article>
      <!-- The project's main PDF (its first document), readable right in the folder. -->
      <article class="page page--right">
        <div class="page__pdf-wrap">
          <iframe class="page__pdf" title="Project report"></iframe>
          <button class="page__expand page__expand--pdf" type="button">⤢ Full view</button>
        </div>
        <div class="page__placeholder page__pdf-empty">Report coming soon</div>
        <!-- Portrait: phones can't show the PDF in the page, so this opens it in a new tab. -->
        <button class="page__pdf-card" type="button" hidden>
          <span class="page__pdf-card-title"></span>
          <span class="page__pdf-card-hint">Opens the PDF</span>
        </button>
      </article>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
